<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="郭悦洋海报作品时间档案：通过日期夹子浏览静态海报、动态海报与长图作品。">
  <title>海报卷宗｜郭悦洋作品集</title>
  <style>
    :root {
      --ink: #2d271f;
      --muted: #766b5e;
      --paper: #f2ecdf;
      --paper-deep: #e8dfcf;
      --mat: #e9e1d3;
      --line: #bdb19e;
      --line-soft: rgba(100, 82, 62, 0.2);
      --red: #b52d22;
      --red-deep: #852118;
      --green: #557451;
      --blue: #516c83;
      --shadow: rgba(66, 50, 34, 0.18);
      --header-h: 122px;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 15% 18%, rgba(255, 255, 255, 0.62), transparent 31%),
        radial-gradient(circle at 83% 72%, rgba(174, 145, 108, 0.08), transparent 27%),
        repeating-linear-gradient(0deg, rgba(73, 55, 36, 0.018) 0, rgba(73, 55, 36, 0.018) 1px, transparent 1px, transparent 4px),
        var(--paper);
    }

    button,
    a {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid rgba(181, 45, 34, 0.45);
      outline-offset: 4px;
    }

    .archive-shell {
      width: 100%;
      height: 100dvh;
      min-height: 640px;
      display: grid;
      grid-template-rows: var(--header-h) minmax(0, 1fr);
      position: relative;
      isolation: isolate;
    }

    .archive-shell::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.19;
      background-image:
        repeating-radial-gradient(circle at 17% 23%, rgba(64, 44, 24, 0.18) 0 0.45px, transparent 0.6px 4px),
        repeating-linear-gradient(91deg, transparent 0 8px, rgba(255, 255, 255, 0.18) 8px 9px);
      mix-blend-mode: multiply;
    }

    /* 顶部日期夹子 */
    .timeline-header {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: 214px minmax(0, 1fr);
      align-items: stretch;
      border-bottom: 1px solid rgba(86, 67, 47, 0.38);
      background: rgba(244, 239, 229, 0.94);
      backdrop-filter: blur(8px);
    }

    .brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 22px 18px 0 30px;
      background: linear-gradient(90deg, rgba(244, 239, 229, 0.98) 0 88%, rgba(244, 239, 229, 0));
    }

    .brand h1 {
      margin: 0;
      white-space: nowrap;
      font: 700 clamp(28px, 2.35vw, 42px) / 1 var(--serif);
      letter-spacing: 0.08em;
    }

    .brand-mark {
      width: 2px;
      height: 34px;
      margin-top: 1px;
      background: var(--red);
    }

    .timeline-scroll {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(89, 69, 48, 0.32) transparent;
      overscroll-behavior-x: contain;
    }

    .timeline-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .timeline-scroll::-webkit-scrollbar-thumb {
      border-radius: 99px;
      background: rgba(89, 69, 48, 0.28);
    }

    .timeline-list {
      min-width: max-content;
      height: 100%;
      display: flex;
      align-items: flex-start;
      gap: 0;
      position: relative;
      padding: 0 28px;
    }

    .timeline-list::before {
      content: "";
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(180deg, #c44335, var(--red));
      box-shadow: 0 1px 0 rgba(100, 28, 20, 0.28);
    }

    .timeline-list::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 9px;
      opacity: 0.4;
      background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 5px, var(--ink) 5px 6px, transparent 6px 10px);
      mask-image: linear-gradient(#000 0 40%, transparent 40%);
    }

    .date-clip {
      width: 112px;
      height: 109px;
      padding: 60px 4px 10px;
      border: 0;
      color: var(--ink);
      background: transparent;
      position: relative;
      z-index: 2;
      cursor: pointer;
      transition: color 180ms ease, transform 180ms ease;
    }

    .date-clip:hover {
      color: var(--red);
      transform: translateY(-2px);
    }

    .date-paper {
      position: absolute;
      left: 5px;
      right: 5px;
      top: 48px;
      height: 57px;
      border: 1px solid rgba(98, 76, 52, 0.2);
      border-radius: 0 0 3px 3px;
      background: rgba(248, 243, 233, 0.74);
      box-shadow: 0 2px 3px rgba(61, 44, 28, 0.08);
      transition: all 220ms ease;
    }

    .binder-clip {
      position: absolute;
      top: 28px;
      left: 50%;
      width: 25px;
      height: 18px;
      border: 2px solid #543f31;
      border-radius: 2px 2px 4px 4px;
      background: linear-gradient(90deg, #4a382d, #846754 48%, #4b392d);
      box-shadow: 0 2px 2px rgba(56, 37, 24, 0.2);
      transform: translateX(-50%);
      transform-origin: 50% 4px;
      transition: all 220ms ease;
    }

    .binder-clip::before,
    .binder-clip::after {
      content: "";
      position: absolute;
      top: -13px;
      width: 8px;
      height: 17px;
      border: 2px solid #543f31;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
    }

    .binder-clip::before {
      left: 0;
      transform: rotate(-12deg);
    }

    .binder-clip::after {
      right: 0;
      transform: rotate(12deg);
    }

    .date-main,
    .date-day {
      position: relative;
      z-index: 2;
      display: block;
      font-family: Georgia, "Times New Roman", var(--serif);
      line-height: 1.1;
    }

    .date-main {
      font-size: 14px;
    }

    .date-day {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.11em;
    }

    .date-clip.active {
      width: 132px;
      color: var(--red);
    }

    .date-clip.active .date-paper {
      top: 43px;
      height: 69px;
      border-color: rgba(124, 45, 32, 0.3);
      background: #f8f1e4;
      box-shadow: 0 4px 8px rgba(66, 42, 25, 0.16);
    }

    .date-clip.active .binder-clip {
      top: 20px;
      width: 40px;
      height: 25px;
      border-color: var(--red-deep);
      background: linear-gradient(90deg, var(--red-deep), #d45746 50%, var(--red-deep));
      box-shadow: 0 3px 5px rgba(88, 28, 20, 0.26);
    }

    .date-clip.active .binder-clip::before,
    .date-clip.active .binder-clip::after {
      top: -18px;
      width: 13px;
      height: 23px;
      border-color: #614d3e;
    }

    .date-clip.active .date-main {
      font-size: 24px;
    }

    .date-clip.active .date-day {
      color: var(--red-deep);
    }

    .date-clip.just-selected .binder-clip {
      animation: clipSwing 520ms ease;
    }

    @keyframes clipSwing {
      0% { transform: translateX(-50%) rotate(0); }
      30% { transform: translateX(-50%) rotate(-8deg); }
      62% { transform: translateX(-50%) rotate(5deg); }
      100% { transform: translateX(-50%) rotate(0); }
    }

    /* 主体 75 / 25 */
    .archive-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(280px, 1fr);
      gap: 16px;
      padding: 16px 28px 24px;
    }

    .poster-stage,
    .index-card {
      min-width: 0;
      min-height: 0;
      border: 1px solid rgba(91, 72, 51, 0.34);
      border-radius: 7px;
      background:
        radial-gradient(circle at 20% 12%, rgba(255, 255, 255, 0.42), transparent 30%),
        repeating-linear-gradient(0deg, rgba(91, 68, 44, 0.018) 0 1px, transparent 1px 5px),
        var(--mat);
      box-shadow:
        inset 0 0 0 7px rgba(249, 245, 237, 0.46),
        inset 0 0 0 8px rgba(103, 81, 58, 0.12),
        0 3px 12px rgba(73, 53, 34, 0.08);
    }

    .poster-stage {
      position: relative;
      overflow: hidden;
    }

    .stage-content {
      width: 100%;
      height: 100%;
      position: relative;
      animation: stageIn 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes stageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .mode-label {
      position: absolute;
      top: 22px;
      left: 27px;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font: 600 11px/1 var(--sans);
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .mode-label::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--red);
    }

    .format-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--red);
    }

    .format-live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px rgba(181, 45, 34, 0.12);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 普通图片与 GIF 叠牌 */
    .stack-mode {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      position: relative;
      padding: 40px 26px 24px;
    }

    .poster-stack {
      width: min(46%, 430px);
      height: min(88%, 720px);
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      position: relative;
      cursor: pointer;
      contain: layout paint style;
      -webkit-tap-highlight-color: transparent;
    }

    .poster-card {
      position: absolute;
      inset: 0;
      z-index: var(--z);
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 8px;
      background: #f8f4ea;
      transform-origin: 50% 92%;
      transform: translate(var(--x), var(--y)) rotate(var(--rotate)) scale(var(--scale));
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .poster-card::after {
      content: "";
      position: absolute;
      inset: 5px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .poster-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #eee7da;
      user-select: none;
      -webkit-user-drag: none;
    }

    .poster-card .card-format {
      position: absolute;
      top: 17px;
      right: 16px;
      z-index: 2;
      padding: 4px 7px;
      border: 1px solid currentColor;
      color: #f8f4ea;
      background: rgba(45, 39, 31, 0.73);
      font: 700 10px/1 Georgia, serif;
      letter-spacing: 0.08em;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.14);
    }

    .click-cue {
      position: absolute;
      left: clamp(34px, 7vw, 124px);
      top: 54%;
      z-index: 3;
      width: 126px;
      transform: translateY(-50%);
      color: #5e4a37;
      text-align: center;
      pointer-events: none;
    }

    .cue-arrow {
      width: 56px;
      height: 56px;
      margin: 0 auto 9px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      border-radius: 0 0 42px 0;
      transform: rotate(28deg);
      position: relative;
    }

    .cue-arrow::after {
      content: "";
      position: absolute;
      right: -5px;
      bottom: -3px;
      width: 10px;
      height: 10px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-6deg);
    }

    .cue-icon {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      margin-bottom: 6px;
    }

    .cue-icon i {
      width: 27px;
      height: 17px;
      border: 1px solid currentColor;
      background: var(--paper);
      display: block;
    }

    .cue-icon i + i {
      margin-left: -22px;
      transform: translate(4px, -4px);
    }

    .click-cue strong {
      display: block;
      font: 600 15px/1.45 var(--serif);
      letter-spacing: 0.06em;
    }

    .page-counter {
      position: absolute;
      left: 42px;
      bottom: 27px;
      color: #6c4f30;
      font: 500 clamp(24px, 2vw, 34px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: 0.08em;
    }

    .asset-name {
      position: absolute;
      right: 26px;
      bottom: 24px;
      max-width: 36%;
      overflow: hidden;
      color: var(--muted);
      font: 12px/1.4 var(--sans);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 长图主窗口 + 总览定位框 */
    .long-mode {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 0;
    }

    .long-layout {
      position: absolute;
      inset: 54px 32px 24px;
      width: auto;
      height: auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(30px, 5vw, 72px);
    }

    .long-frame-wrap {
      flex: 0 1 470px;
      width: min(470px, calc(100% - 150px));
      height: 100%;
      max-height: 700px;
      min-height: 0;
      position: relative;
      padding-bottom: 28px;
    }

    .long-frame {
      width: 100%;
      height: 100%;
      position: relative;
      padding: 8px;
      border: 1px solid rgba(73, 55, 37, 0.42);
      background: #f7f1e5;
      box-shadow: 0 9px 17px rgba(58, 41, 26, 0.17);
    }

    .long-scroller {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #796955 rgba(116, 96, 73, 0.14);
      background: #d8cfbe;
      scroll-behavior: smooth;
    }

    .long-scroller::-webkit-scrollbar {
      width: 10px;
    }

    .long-scroller::-webkit-scrollbar-track {
      background: rgba(116, 96, 73, 0.14);
    }

    .long-scroller::-webkit-scrollbar-thumb {
      border: 2px solid #ded5c5;
      border-radius: 99px;
      background: #74634f;
    }

    .long-image-strip {
      width: 100%;
      min-height: 100%;
      line-height: 0;
      background: #d8cfbe;
    }

    .long-image-strip img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .paper-roll {
      position: absolute;
      left: -3px;
      right: -3px;
      bottom: 0;
      height: 42px;
      z-index: 4;
      border: 1px solid rgba(84, 64, 43, 0.22);
      border-radius: 4px 4px 26px 26px / 4px 4px 50% 50%;
      background:
        linear-gradient(180deg, #fffdf7 0 12%, #f1eadf 44%, #d7cbbb 82%, #b6a58e 100%);
      box-shadow: 0 6px 8px rgba(65, 46, 28, 0.17), inset 0 3px 5px rgba(255, 255, 255, 0.85);
      pointer-events: none;
    }

    .paper-roll::after {
      content: "";
      position: absolute;
      right: 6px;
      top: 3px;
      width: 23px;
      height: 33px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, #8f806c 0 16%, #c8baa5 19% 35%, #eee6da 39% 57%, transparent 61%);
      opacity: 0.8;
    }

    .minimap-column {
      align-self: center;
      flex: 0 0 106px;
      width: 106px;
      min-width: 0;
      color: var(--muted);
    }

    .minimap-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      font: 600 12px/1 var(--serif);
      letter-spacing: 0.08em;
    }

    .minimap-heading small {
      color: var(--red);
      font: 700 10px/1 Georgia, serif;
    }

    .minimap {
      width: 100%;
      height: min(63vh, 560px);
      min-height: 340px;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
      border: 1px solid rgba(79, 58, 38, 0.38);
      background: #ddd2bf;
      box-shadow: 0 5px 13px rgba(61, 44, 27, 0.16);
    }

    .minimap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      opacity: 0.86;
      user-select: none;
      -webkit-user-drag: none;
    }

    .viewport-indicator {
      position: absolute;
      z-index: 3;
      left: 4px;
      right: 4px;
      top: 0;
      min-height: 24px;
      border: 2px solid var(--red);
      background: rgba(255, 249, 228, 0.18);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.72) inset,
        0 2px 5px rgba(67, 28, 18, 0.25);
      cursor: grab;
      transition: height 120ms ease;
    }

    .viewport-indicator::before,
    .viewport-indicator::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 18px;
      height: 2px;
      background: rgba(181, 45, 34, 0.72);
      transform: translateX(-50%);
    }

    .viewport-indicator::before { top: 5px; }
    .viewport-indicator::after { bottom: 5px; }

    .viewport-indicator.dragging {
      cursor: grabbing;
      background: rgba(255, 246, 214, 0.28);
      box-shadow: 0 0 0 2px rgba(181, 45, 34, 0.16);
    }

    .minimap-help {
      margin: 10px 0 0;
      font: 10px/1.5 var(--sans);
      text-align: center;
    }

    .scroll-progress {
      margin-top: 7px;
      color: #6e4f31;
      text-align: center;
      font: 500 26px/1 Georgia, serif;
    }

    /* 右侧档案索引卡 */
    .index-card {
      position: relative;
      overflow: auto;
      padding: 52px clamp(24px, 2.2vw, 38px) 24px;
      background:
        linear-gradient(90deg, rgba(118, 91, 61, 0.035) 1px, transparent 1px),
        linear-gradient(rgba(118, 91, 61, 0.028) 1px, transparent 1px),
        #e9dfcf;
      background-size: 7px 7px;
      scrollbar-width: thin;
      scrollbar-color: rgba(91, 70, 47, 0.3) transparent;
    }

    .index-card::before {
      content: "";
      position: absolute;
      top: 34px;
      left: 26px;
      width: 18px;
      height: 18px;
      border: 5px solid var(--red);
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45), 0 1px 2px rgba(73, 46, 29, 0.2);
    }

    .paperclip {
      position: absolute;
      top: 17px;
      right: 37px;
      width: 21px;
      height: 63px;
      border: 3px solid #665e53;
      border-radius: 13px;
      transform: rotate(16deg);
      box-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
      opacity: 0.9;
    }

    .paperclip::after {
      content: "";
      position: absolute;
      top: 7px;
      left: 5px;
      width: 8px;
      height: 42px;
      border: 2px solid #665e53;
      border-radius: 8px;
      border-top-color: transparent;
    }

    .card-title {
      margin: 0 0 27px;
      padding: 0 50px 17px;
      border-bottom: 1px dashed rgba(94, 72, 48, 0.38);
      color: var(--red);
      text-align: center;
      font: 700 clamp(21px, 1.8vw, 30px)/1.2 var(--serif);
      letter-spacing: 0.09em;
    }

    .archive-field {
      margin-bottom: 17px;
      padding-bottom: 13px;
      border-bottom: 1px dashed rgba(94, 72, 48, 0.3);
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font: 500 11px/1.2 var(--sans);
      letter-spacing: 0.13em;
    }

    .field-value {
      margin: 0;
      color: var(--ink);
      font: 500 15px/1.55 var(--serif);
      overflow-wrap: anywhere;
    }

    .field-value.project-name {
      font-size: clamp(16px, 1.25vw, 20px);
      font-weight: 700;
    }

    .stamp-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .stamp {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      padding: 4px 10px 3px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
      color: var(--red);
      font: 700 14px/1 Georgia, serif;
      letter-spacing: 0.05em;
      transform: rotate(-1deg);
    }

    .stamp:nth-child(2n) {
      color: var(--green);
      transform: rotate(1deg);
    }

    .stamp:nth-child(3n) {
      color: var(--blue);
      transform: rotate(-0.5deg);
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--red-deep);
      font: 600 13px/1.4 var(--sans);
      text-decoration: none;
      border-bottom: 1px solid rgba(133, 33, 24, 0.3);
    }

    .source-link:hover {
      color: var(--red);
      border-bottom-color: currentColor;
    }

    .card-note {
      margin: 6px 0 0;
      color: var(--muted);
      font: 10px/1.5 var(--sans);
      letter-spacing: 0.06em;
    }

    .error-placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      background: #e8dfd1;
      text-align: center;
      font: 13px/1.6 var(--sans);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Signal Editorial skin
       Keep the archive mechanics intact; only the visual system is replaced. */
    :root {
      --ink: #111315;
      --muted: #5b6066;
      --paper: #ffffff;
      --paper-deep: #f3f4f5;
      --mat: #f8f8f8;
      --line: #e5e5e5;
      --line-soft: rgba(17, 19, 21, 0.12);
      --red: #e4002b;
      --red-deep: #b80024;
      --green: #5b6066;
      --blue: #111315;
      --shadow: rgba(17, 19, 21, 0.08);
      --banner-h: clamp(118px, 15vh, 152px);
      --timeline-h: 122px;
      --header-h: calc(var(--banner-h) + var(--timeline-h));
      --serif: "Noto Sans SC", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      --sans: "Noto Sans SC", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "Space Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    body {
      background:
        repeating-linear-gradient(0deg, rgba(17, 19, 21, 0.012) 0, rgba(17, 19, 21, 0.012) 1px, transparent 1px, transparent 5px),
        var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      color: var(--paper);
      background: var(--red);
    }

    button:focus-visible,
    a:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    .archive-shell::after {
      opacity: 0.045;
      background-image:
        repeating-radial-gradient(circle at 17% 23%, rgba(17, 19, 21, 0.35) 0 0.35px, transparent 0.5px 4px),
        repeating-linear-gradient(90deg, transparent 0 11px, rgba(17, 19, 21, 0.12) 11px 12px);
      mix-blend-mode: multiply;
    }

    .timeline-header {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: var(--banner-h) var(--timeline-h);
      border-bottom-color: var(--border);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 1px 0 rgba(17, 19, 21, 0.04);
      backdrop-filter: blur(12px);
    }

    .cascade-banner {
      grid-column: 1 / -1;
      grid-row: 1;
      min-width: 0;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr);
      align-items: end;
      gap: 8px 24px;
      overflow: hidden;
      padding: 18px 30px 15px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(90deg, rgba(17, 19, 21, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(17, 19, 21, 0.04) 1px, transparent 1px),
        rgba(255, 255, 255, 0.97);
      background-size: 24px 24px;
    }

    .cascade-kicker {
      grid-column: 1 / -1;
      align-self: start;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font: 700 10px/1 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .cascade-kicker span:first-child {
      color: var(--red);
    }

    .letter-cascade {
      --cascade-duration: 680ms;
      --cascade-stagger: 56ms;
      grid-column: 1;
      min-width: 0;
      margin: 0;
      display: inline-flex;
      align-items: baseline;
      align-self: end;
      width: max-content;
      max-width: 100%;
      color: var(--ink);
      font: 700 clamp(46px, 6vw, 86px) / 1 var(--sans);
      letter-spacing: -0.075em;
      cursor: default;
      user-select: none;
      perspective: 900px;
      outline-offset: 7px;
    }

    .cascade-letter {
      position: relative;
      display: inline-grid;
      flex: 0 0 auto;
      place-items: center;
      perspective: 520px;
      transform-style: preserve-3d;
    }

    .cascade-front,
    .cascade-echo {
      grid-area: 1 / 1;
      display: block;
      white-space: pre;
      backface-visibility: hidden;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
    }

    .cascade-front {
      transform: translate3d(0, 0, 0) rotateX(0deg);
      transform-origin: bottom center;
    }

    .cascade-echo {
      position: absolute;
      inset: 0;
      color: var(--red);
      opacity: 0;
      filter: blur(4px);
      transform: translate3d(0, 0.16em, 0) rotateX(-92deg) scale(0.82);
      transform-origin: top center;
    }

    .letter-cascade.is-cascading .cascade-front {
      animation: cascadeFront var(--cascade-duration) cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--i) * var(--cascade-stagger));
    }

    .letter-cascade.is-cascading .cascade-echo {
      animation: cascadeEcho var(--cascade-duration) cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: calc(var(--i) * var(--cascade-stagger));
    }

    @keyframes cascadeFront {
      0% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 0) rotateX(0deg);
      }
      32%, 56% {
        opacity: 0;
        filter: blur(4px);
        transform: translate3d(0, -0.1em, 0) rotateX(92deg) scaleY(0.94);
      }
      78% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0.025em, 0) rotateX(-13deg);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 0) rotateX(0deg);
      }
    }

    @keyframes cascadeEcho {
      0% {
        opacity: 0;
        filter: blur(4px);
        transform: translate3d(0, 0.16em, 0) rotateX(-92deg) scale(0.82);
      }
      34% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, -0.01em, 20px) rotateX(10deg) scale(1.03);
      }
      56% {
        opacity: 1;
        filter: blur(0);
        transform: translate3d(0, 0, 12px) rotateX(0deg) scale(1);
      }
      76%, 100% {
        opacity: 0;

      function setupLetterCascade() {
        const cascade = document.querySelector("[data-letter-cascade]");
        if (!cascade) return;

        const text = cascade.dataset.cascadeText || "";
        const fragment = document.createDocumentFragment();
        [...text].forEach((letter, index) => {
          const cell = document.createElement("span");
          cell.className = "cascade-letter";
          cell.style.setProperty("--i", String(index));

          const front = document.createElement("span");
          front.className = "cascade-front";
          front.textContent = letter;

          const echo = document.createElement("span");
          echo.className = "cascade-echo";
          echo.setAttribute("aria-hidden", "true");
          echo.textContent = letter;

          cell.append(front, echo);
          fragment.appendChild(cell);
        });
        cascade.replaceChildren(fragment);

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        let isAnimating = false;
        let hasPlayedInView = false;
        let releaseTimer = 0;

        const replay = () => {
          if (reducedMotion.matches || isAnimating) return;
          isAnimating = true;
          cascade.classList.remove("is-cascading");
          void cascade.offsetWidth;
          cascade.classList.add("is-cascading");
          window.clearTimeout(releaseTimer);
          releaseTimer = window.setTimeout(() => {
            cascade.classList.remove("is-cascading");
            isAnimating = false;
          }, 1120);
        };

        cascade.addEventListener("pointerenter", replay);
        cascade.addEventListener("focus", replay);
        cascade.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          replay();
        });

        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver((entries) => {
            if (hasPlayedInView || !entries.some((entry) => entry.isIntersecting)) return;
            hasPlayedInView = true;
            replay();
            observer.disconnect();
          }, { threshold: 0.35 });
          observer.observe(cascade);
        } else {
          hasPlayedInView = true;
          window.requestAnimationFrame(replay);
        }
      }

      function renderStack(project, projectIndex) {
        const current = stackPositions.get(projectIndex) || 0;
        const visibleCount = Math.min(4, project.media.length);
        const cards = [];
        const rotations = ["-1.1deg", "2.2deg", "-2.8deg", "3.4deg"];

        const currentFile = project.media[current];

            <div class="asset-name" title="${escapeHtml(currentFile)}">${escapeHtml(currentFile)}</div>
          </div>
        `;

        stageContent.querySelectorAll("img").forEach((image) => attachImageFallback(image));
        const stackButton = document.getElementById("posterStack");
        const frontImage = stackButton.querySelector(".poster-card.is-front img");
        const fitCurrentPoster = () => fitStackToImage(stackButton, frontImage);
        activeStackFit = fitCurrentPoster;
        frontImage.addEventListener("load", fitCurrentPoster, { once: true });
        if (frontImage.complete && frontImage.naturalWidth) requestAnimationFrame(fitCurrentPoster);

        if (project.media.length > visibleCount) {
          const preloadIndex = (current + visibleCount) % project.media.length;
          preloadAsset(getAssetPath(project, project.media[preloadIndex]));
        }
        stackButton.addEventListener("click", () => flipPoster(project, projectIndex, stackButton));

      function fitStackToImage(stackButton, image) {
        if (!stackButton || !image || !image.naturalWidth || !image.naturalHeight) return;
        const host = stackButton.closest(".stack-mode");
        if (!host) return;
        const ratio = image.naturalWidth / image.naturalHeight;
        const maxHeight = Math.min(host.clientHeight * 0.89, 780);
        const maxWidth = Math.min(host.clientWidth * 0.68, 720);
        let height = maxHeight;
        let width = height * ratio;
        if (width > maxWidth) {
          width = maxWidth;
          height = width / ratio;
        }
        stackButton.style.width = `${Math.round(width)}px`;
        stackButton.style.height = `${Math.round(height)}px`;
      }

      function preloadAsset(source) {
        if (preloadCache.has(source)) return;
        const image = new Image();
        image.decoding = "async";
        image.src = source;
        preloadCache.set(source, image);
      }

      async function flipPoster(project, projectIndex, stackButton) {
        if (isFlipping || project.media.length < 2) return;
        isFlipping = true;
        const token = ++flipToken;
        const next = ((stackPositions.get(projectIndex) || 0) + 1) % project.media.length;
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const duration = reducedMotion ? 1 : 260;
        const easing = "cubic-bezier(0.22, 1, 0.36, 1)";
        const cards = [...stackButton.querySelectorAll(".poster-card")];
        const animations = [];

        cards.forEach((card) => {
          const depth = Number(card.dataset.depth || 0);
          card.style.willChange = "transform, opacity";
          const startTransform = getComputedStyle(card).transform;
          let keyframes;

          if (depth === 0) {
            keyframes = [
              { transform: startTransform, opacity: 1 },
              { transform: "translate3d(-38%, 1%, 0) rotate(-7deg) scale(0.99)", opacity: 0.96, offset: 0.62 },
              { transform: "translate3d(24px, -10px, 0) rotate(3deg) scale(0.92)", opacity: 0 }
            ];
          } else {
            const targetDepth = depth - 1;
            const targetRotation = ["-1.1deg", "2.2deg", "-2.8deg"][targetDepth];
            const targetScale = 1 - targetDepth * 0.026;
            keyframes = [
              { transform: startTransform, opacity: 1 },
              { transform: `translate3d(${targetDepth * 14}px, ${targetDepth * -6}px, 0) rotate(${targetRotation}) scale(${targetScale})`, opacity: 1 }
            ];
          }

          animations.push(card.animate(keyframes, { duration, easing, fill: "forwards" }));
        });

        try {
          await Promise.all(animations.map((animation) => animation.finished));
        } catch (_) {
          // A rapid project switch can cancel the animation; the next render still wins.
        }

        if (token !== flipToken || activeProjectIndex !== projectIndex) return;
        stackPositions.set(projectIndex, next);
        isFlipping = false;
        renderStack(project, projectIndex);
        liveStatus.textContent = `已切换到第 ${next + 1} 张海报：${project.media[next]}`;
      }

      function setupMinimap() {
        if (typeof minimapCleanup === "function") minimapCleanup();

        const scroller = document.getElementById("longScroller");
        const imageStrip = document.getElementById("longImage");
        const segmentImages = [...document.querySelectorAll("#longImage .long-segment")];
        const minimap = document.getElementById("minimap");
        const indicator = document.getElementById("viewportIndicator");
        const progress = document.getElementById("scrollProgress");
        if (!scroller || !imageStrip || !minimap || !indicator || !progress) return;

        let dragging = false;
        let dragOffset = 0;

        const metrics = () => {
          const mapHeight = minimap.clientHeight;
          const contentHeight = Math.max(scroller.scrollHeight, scroller.clientHeight);
          const viewportRatio = Math.min(1, scroller.clientHeight / contentHeight);
          const indicatorHeight = Math.max(24, mapHeight * viewportRatio);
          const maxIndicatorTop = Math.max(0, mapHeight - indicatorHeight);
          const maxScroll = Math.max(0, contentHeight - scroller.clientHeight);
          return { mapHeight, indicatorHeight, maxIndicatorTop, maxScroll };
        };

        const updateIndicator = () => {
          const { indicatorHeight, maxIndicatorTop, maxScroll } = metrics();
          const ratio = maxScroll > 0 ? scroller.scrollTop / maxScroll : 0;
          const percent = Math.round(ratio * 100);
          indicator.style.height = `${indicatorHeight}px`;
          indicator.style.transform = `translateY(${ratio * maxIndicatorTop}px)`;
          progress.textContent = `${percent}%`;
          minimap.setAttribute("aria-valuenow", String(percent));
          minimap.setAttribute("aria-valuetext", `已浏览 ${percent}%`);
        };

        const seekToTop = (top) => {
          const { maxIndicatorTop, maxScroll } = metrics();
          const clamped = Math.min(maxIndicatorTop, Math.max(0, top));
          const ratio = maxIndicatorTop > 0 ? clamped / maxIndicatorTop : 0;
          scroller.scrollTop = ratio * maxScroll;
          updateIndicator();
        };

        const seekFromClientY = (clientY, useDragOffset = false) => {
          const rect = minimap.getBoundingClientRect();
          const { indicatorHeight } = metrics();
          const offset = useDragOffset ? dragOffset : indicatorHeight / 2;
          seekToTop(clientY - rect.top - offset);
        };

        const onScroll = () => updateIndicator();
        const onResize = () => updateIndicator();
        const onSegmentLoad = () => requestAnimationFrame(updateIndicator);

        const onPointerDown = (event) => {
          const mapRect = minimap.getBoundingClientRect();
          const indicatorRect = indicator.getBoundingClientRect();
          const hitIndicator = event.clientY >= indicatorRect.top && event.clientY <= indicatorRect.bottom;
          dragging = true;
          dragOffset = hitIndicator ? event.clientY - indicatorRect.top : indicatorRect.height / 2;
          minimap.setPointerCapture(event.pointerId);
          indicator.classList.add("dragging");
          if (!hitIndicator) seekFromClientY(event.clientY, true);
          event.preventDefault();
        };

        const onPointerMove = (event) => {
          if (!dragging) return;
          seekFromClientY(event.clientY, true);
          event.preventDefault();
        };

        const stopDragging = (event) => {
          if (!dragging) return;
          dragging = false;
          indicator.classList.remove("dragging");
          if (minimap.hasPointerCapture(event.pointerId)) minimap.releasePointerCapture(event.pointerId);
        };

        const onKeyDown = (event) => {
          const step = Math.max(80, scroller.clientHeight * 0.8);
          if (event.key === "ArrowDown" || event.key === "PageDown") {
            scroller.scrollBy({ top: step, behavior: "smooth" });
            event.preventDefault();
          } else if (event.key === "ArrowUp" || event.key === "PageUp") {
            scroller.scrollBy({ top: -step, behavior: "smooth" });
            event.preventDefault();
          } else if (event.key === "Home") {
            scroller.scrollTo({ top: 0, behavior: "smooth" });
            event.preventDefault();
          } else if (event.key === "End") {
            scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
            event.preventDefault();
          }
        };

        scroller.addEventListener("scroll", onScroll, { passive: true });
        segmentImages.forEach((image) => image.addEventListener("load", onSegmentLoad));
        minimap.addEventListener("pointerdown", onPointerDown);
        minimap.addEventListener("pointermove", onPointerMove);
        minimap.addEventListener("pointerup", stopDragging);
        minimap.addEventListener("pointercancel", stopDragging);
        minimap.addEventListener("keydown", onKeyDown);
        window.addEventListener("resize", onResize);

        scroller.scrollTop = 0;
        requestAnimationFrame(updateIndicator);
        segmentImages.filter((image) => image.complete).forEach(() => requestAnimationFrame(updateIndicator));

        minimapCleanup = () => {
          scroller.removeEventListener("scroll", onScroll);
          segmentImages.forEach((image) => image.removeEventListener("load", onSegmentLoad));
          minimap.removeEventListener("pointerdown", onPointerDown);
          minimap.removeEventListener("pointermove", onPointerMove);
          minimap.removeEventListener("pointerup", stopDragging);
          minimap.removeEventListener("pointercancel", stopDragging);
          minimap.removeEventListener("keydown", onKeyDown);
          window.removeEventListener("resize", onResize);
        };
      }

      function attachImageFallback(image) {
        image.addEventListener("error", () => {
          const parent = image.parentElement;
          if (!parent) return;
          const placeholder = document.createElement("div");
          placeholder.className = "error-placeholder";
          placeholder.textContent = "图片暂时无法读取，请确认 HTML 与海报文件夹保持在同一位置。";
          image.replaceWith(placeholder);
        }, { once: true });
      }

      function selectProject(index, animateClip = false) {
        if (index < 0 || index >= projects.length) return;
        if (typeof minimapCleanup === "function") {
          minimapCleanup();
          minimapCleanup = null;
        }

        activeProjectIndex = index;
        flipToken += 1;
        isFlipping = false;
        activeStackFit = null;
        renderTimeline();

        const activeButton = timelineList.querySelector(`.date-clip[data-index="${index}"]`);
        if (activeButton) {
          if (animateClip) {
            activeButton.classList.add("just-selected");
            window.setTimeout(() => activeButton.classList.remove("just-selected"), 540);
          }
          activeButton.scrollIntoView({ behavior: animateClip ? "smooth" : "auto", block: "nearest", inline: "center" });
        }

        const project = projects[index];
        stageContent.style.animation = "none";
        void stageContent.offsetWidth;
        stageContent.style.animation = "";

        if (project.type === "long") {
          renderLong(project);
        } else {
          renderStack(project, index);
        }
        renderIndexCard(project);
        liveStatus.textContent = `已切换到 ${project.date} 的项目：${project.title}`;
      }

      timelineScroll.addEventListener("wheel", (event) => {
        if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
          timelineScroll.scrollLeft += event.deltaY;
          event.preventDefault();
        }
      }, { passive: false });

      timelineScroll.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        const direction = event.key === "ArrowRight" ? 1 : -1;
        selectProject(Math.min(projects.length - 1, Math.max(0, activeProjectIndex + direction)), true);
        event.preventDefault();
      });

      window.addEventListener("resize", () => {
        if (typeof activeStackFit === "function") activeStackFit();
      });

      setupLetterCascade();
      renderTimeline();
      selectProject(activeProjectIndex, false);
    })();
  </script>
</body>
</html>

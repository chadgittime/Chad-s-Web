<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <style>
    .sans{font-family:Inter,"Noto Sans SC","Source Han Sans SC","PingFang SC",sans-serif}
    .mono{font-family:"Space Mono","SFMono-Regular",monospace}
    .ink{fill:#111315}.muted{fill:#5b6066}.light{fill:#9aa0a6}.red{fill:#e4002b}.blue{fill:#1f77b4}
    .body{font-size:16px}.small{font-size:12px}.micro{font-size:10px;letter-spacing:1.5px}
    .hair{stroke:#d9dcdf;stroke-width:1}.rule{stroke:#111315;stroke-width:1.5}.redrule{stroke:#e4002b;stroke-width:2}
  </style>

  <!-- page ruler / title -->
  <rect x="72" y="52" width="1456" height="4" fill="#e4002b"/>
  <text x="72" y="92" class="mono red" font-size="12" letter-spacing="2">CONTENT DISPATCH / OPENING SEQUENCE 01</text>
  <text x="72" y="164" class="sans ink" font-size="58" font-weight="800">让一条内容，找到它该出现的位置。</text>
  <text x="76" y="205" class="sans muted body">滚轮就是时间轴：一条来自朝阳区商务局的微信推送，从选题库进入发布日历。</text>
  <text x="1290" y="92" class="mono muted small">SCROLL-DRIVEN</text>
  <text x="1290" y="116" class="mono ink small">FRAME 048 / 100</text>
  <line x1="1290" y1="132" x2="1528" y2="132" class="hair"/>
  <line x1="1290" y1="132" x2="1404" y2="132" class="redrule"/>

  <!-- main interface -->
  <line x1="72" y1="264" x2="1528" y2="264" class="rule"/>
  <line x1="72" y1="744" x2="1528" y2="744" class="rule"/>

  <!-- left: topic library -->
  <g transform="translate(72,290)">
    <text x="0" y="0" class="mono muted micro">01 / TOPIC LIBRARY</text>
    <text x="0" y="38" class="sans ink" font-size="28" font-weight="750">选题库</text>
    <text x="270" y="36" class="mono muted small">12 ITEMS</text>
    <line x1="0" y1="58" x2="336" y2="58" class="hair"/>

    <g transform="translate(0,82)">
      <rect x="0" y="0" width="336" height="118" fill="#ffffff" stroke="#e4002b" stroke-width="2"/>
      <rect x="0" y="0" width="7" height="118" fill="#e4002b"/>
      <text x="24" y="27" class="mono red small">朝阳区商务局 · 11:24</text>
      <text x="24" y="58" class="sans ink body" font-weight="700">最高奖励500万！</text>
      <text x="24" y="82" class="sans ink body" font-weight="700">朝阳支持“一人公司”</text>
      <text x="24" y="105" class="mono muted" font-size="10">政策信息 / 待排期</text>
    </g>

    <g transform="translate(0,216)">
      <rect x="0" y="0" width="336" height="86" fill="#f4f5f6"/>
      <text x="18" y="24" class="mono muted small">朝阳区文旅局 · 10:46</text>
      <text x="18" y="52" class="sans ink body" font-weight="650">周末去哪儿｜亮马河夜游上新</text>
      <text x="18" y="73" class="mono muted" font-size="10">文旅服务 / 待核实</text>
    </g>

    <g transform="translate(0,318)">
      <rect x="0" y="0" width="336" height="86" fill="#f4f5f6"/>
      <text x="18" y="24" class="mono muted small">三里屯街道 · 09:08</text>
      <text x="18" y="52" class="sans ink body" font-weight="650">社区食堂，新增晚间服务</text>
      <text x="18" y="73" class="mono muted" font-size="10">民生服务 / 可发布</text>
    </g>
  </g>

  <!-- center: editorial judgment -->
  <line x1="432" y1="264" x2="432" y2="744" class="hair"/>
  <g transform="translate(464,290)">
    <text x="0" y="0" class="mono muted micro">02 / EDITORIAL JUDGMENT</text>
    <text x="0" y="38" class="sans ink" font-size="28" font-weight="750">编辑判断</text>
    <line x1="0" y1="58" x2="360" y2="58" class="hair"/>

    <circle cx="7" cy="91" r="4" fill="#1f77b4"/>
    <text x="20" y="96" class="mono blue small">事实核验通过</text>
    <text x="0" y="139" class="sans ink body" font-weight="700">来源权威性</text>
    <text x="328" y="139" class="mono muted small">04/05</text>
    <rect x="0" y="151" width="360" height="4" fill="#e5e7e9"/>
    <rect x="0" y="151" width="288" height="4" fill="#111315"/>

    <text x="0" y="195" class="sans ink body" font-weight="700">用户相关性</text>
    <text x="328" y="195" class="mono muted small">04/05</text>
    <rect x="0" y="207" width="360" height="4" fill="#e5e7e9"/>
    <rect x="0" y="207" width="288" height="4" fill="#111315"/>

    <text x="0" y="251" class="sans ink body" font-weight="700">时效性</text>
    <text x="328" y="251" class="mono muted small">03/05</text>
    <rect x="0" y="263" width="360" height="4" fill="#e5e7e9"/>
    <rect x="0" y="263" width="216" height="4" fill="#5b6066"/>

    <text x="0" y="307" class="sans ink body" font-weight="700">风险程度</text>
    <text x="328" y="307" class="mono muted small">02/05</text>
    <rect x="0" y="319" width="360" height="4" fill="#e5e7e9"/>
    <rect x="0" y="319" width="144" height="4" fill="#5b6066"/>

    <line x1="0" y1="354" x2="360" y2="354" class="hair"/>
    <text x="0" y="384" class="mono muted micro">DECISION</text>
    <rect x="0" y="402" width="82" height="34" fill="#111315"/>
    <text x="41" y="424" class="sans" fill="#ffffff" font-size="13" text-anchor="middle">改写</text>
    <text x="106" y="424" class="sans muted" font-size="13">直接发布</text>
    <text x="202" y="424" class="sans muted" font-size="13">继续核实</text>
    <text x="300" y="424" class="sans muted" font-size="13">延后</text>
  </g>

  <!-- right: publishing calendar -->
  <line x1="856" y1="264" x2="856" y2="744" class="hair"/>
  <g transform="translate(888,290)">
    <text x="0" y="0" class="mono muted micro">03 / PUBLISHING CALENDAR</text>
    <text x="0" y="38" class="sans ink" font-size="28" font-weight="750">本周发布日历</text>
    <text x="536" y="36" class="mono muted small">AUG 10—14</text>
    <line x1="0" y1="58" x2="640" y2="58" class="hair"/>

    <g transform="translate(0,82)">
      <text x="0" y="0" class="mono muted small">MON / 10</text>
      <text x="128" y="0" class="mono muted small">TUE / 11</text>
      <text x="256" y="0" class="mono red small">WED / 12</text>
      <text x="384" y="0" class="mono muted small">THU / 13</text>
      <text x="512" y="0" class="mono muted small">FRI / 14</text>

      <!-- grid -->
      <g transform="translate(0,20)">
        <path d="M0 0H640 M0 78H640 M0 156H640 M0 234H640 M0 312H640" class="hair" fill="none"/>
        <path d="M0 0V312 M128 0V312 M256 0V312 M384 0V312 M512 0V312 M640 0V312" class="hair" fill="none"/>

        <rect x="10" y="12" width="108" height="52" fill="#f4f5f6"/>
        <text x="20" y="34" class="sans ink" font-size="12" font-weight="650">政策回顾</text>
        <text x="20" y="51" class="mono muted" font-size="9">01 / 已排期</text>

        <rect x="138" y="12" width="108" height="52" fill="#f4f5f6"/>
        <text x="148" y="34" class="sans ink" font-size="12" font-weight="650">生活服务</text>
        <text x="148" y="51" class="mono muted" font-size="9">01 / 已排期</text>

        <rect x="266" y="12" width="108" height="52" fill="#ffffff" stroke="#e4002b" stroke-width="2" stroke-dasharray="6 5"/>
        <text x="320" y="35" class="mono red" font-size="10" text-anchor="middle">TARGET / 01</text>
        <text x="320" y="51" class="sans red" font-size="11" text-anchor="middle">周三第一条</text>

        <rect x="394" y="12" width="108" height="52" fill="#f4f5f6"/>
        <text x="404" y="34" class="sans ink" font-size="12" font-weight="650">便民提醒</text>
        <text x="404" y="51" class="mono muted" font-size="9">01 / 已排期</text>

        <rect x="522" y="12" width="108" height="52" fill="#f4f5f6"/>
        <text x="532" y="34" class="sans ink" font-size="12" font-weight="650">周末指南</text>
        <text x="532" y="51" class="mono muted" font-size="9">01 / 已排期</text>

        <rect x="10" y="90" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>
        <rect x="138" y="90" width="108" height="52" fill="#f4f5f6"/>
        <text x="148" y="113" class="sans ink" font-size="12" font-weight="650">文旅活动</text>
        <text x="148" y="130" class="mono muted" font-size="9">02 / 已排期</text>
        <rect x="266" y="90" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>
        <rect x="394" y="90" width="108" height="52" fill="#f4f5f6"/>
        <text x="404" y="113" class="sans ink" font-size="12" font-weight="650">社区故事</text>
        <text x="404" y="130" class="mono muted" font-size="9">02 / 已排期</text>
        <rect x="522" y="90" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>

        <rect x="10" y="168" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>
        <rect x="138" y="168" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>
        <rect x="266" y="168" width="108" height="52" fill="#f4f5f6"/>
        <text x="276" y="191" class="sans ink" font-size="12" font-weight="650">营商环境</text>
        <text x="276" y="208" class="mono muted" font-size="9">03 / 已排期</text>
        <rect x="394" y="168" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>
        <rect x="522" y="168" width="108" height="52" fill="#fafafa" stroke="#d9dcdf"/>

        <text x="12" y="290" class="mono muted" font-size="9">EMPTY SLOTS REMAIN VISIBLE</text>
        <text x="630" y="290" class="mono muted" font-size="9" text-anchor="end">12 / 15 OCCUPIED</text>
      </g>
    </g>
  </g>

  <!-- motion path and flying card -->
  <path d="M330 432 C520 378 720 360 1208 402" fill="none" stroke="#e4002b" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="330" cy="432" r="5" fill="#e4002b"/>
  <circle cx="1208" cy="402" r="8" fill="#ffffff" stroke="#e4002b" stroke-width="2"/>
  <g transform="translate(716,362) rotate(-2 150 64)">
    <rect x="10" y="12" width="300" height="124" fill="#111315" opacity="0.08"/>
    <rect x="0" y="0" width="300" height="124" fill="#ffffff" stroke="#111315" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="5" fill="#e4002b"/>
    <text x="18" y="28" class="mono red" font-size="10">朝阳区商务局 / IN TRANSIT</text>
    <text x="18" y="58" class="sans ink" font-size="16" font-weight="750">最高奖励500万！</text>
    <text x="18" y="82" class="sans ink" font-size="16" font-weight="750">朝阳支持“一人公司”</text>
    <text x="18" y="107" class="mono muted" font-size="9">SCROLL POSITION 48%</text>
    <text x="280" y="107" class="mono red" font-size="18" text-anchor="end">→</text>
  </g>

  <!-- scroll protocol -->
  <g transform="translate(72,790)">
    <text x="0" y="0" class="mono muted micro">SCROLL PROTOCOL / 0—100%</text>
    <line x1="0" y1="34" x2="1456" y2="34" class="hair"/>
    <line x1="0" y1="34" x2="699" y2="34" class="redrule"/>
    <circle cx="0" cy="34" r="5" fill="#111315"/>
    <circle cx="430" cy="34" r="5" fill="#111315"/>
    <circle cx="1010" cy="34" r="5" fill="#ffffff" stroke="#111315" stroke-width="2"/>
    <circle cx="1456" cy="34" r="5" fill="#ffffff" stroke="#111315" stroke-width="2"/>

    <text x="0" y="69" class="mono red small">00—20</text>
    <text x="0" y="94" class="sans ink body" font-weight="700">卡片脱离选题库</text>
    <text x="0" y="118" class="sans muted" font-size="13">原位置留下空槽，建立起点。</text>

    <text x="430" y="69" class="mono red small">20—55</text>
    <text x="430" y="94" class="sans ink body" font-weight="700">穿过判断区</text>
    <text x="430" y="118" class="sans muted" font-size="13">指标依次显现，卡片只移动不旋转炫技。</text>

    <text x="1010" y="69" class="mono muted small">55—85</text>
    <text x="1010" y="94" class="sans ink body" font-weight="700">目标槽位展开</text>
    <text x="1010" y="118" class="sans muted" font-size="13">周三第一条以红色标尺线吸附。</text>

    <text x="1456" y="69" class="mono muted small" text-anchor="end">85—100</text>
    <text x="1456" y="94" class="sans ink body" font-weight="700" text-anchor="end">落位并进入正文</text>
    <text x="1456" y="118" class="sans muted" font-size="13" text-anchor="end">日历恢复静态，继续推送与数据分析。</text>
  </g>

  <!-- next section glimpse -->
  <rect x="72" y="956" width="1456" height="2" fill="#111315"/>
  <text x="72" y="986" class="mono muted small">NEXT / 02</text>
  <text x="184" y="986" class="sans ink body" font-weight="700">推送展示与数据分析</text>
  <text x="1528" y="986" class="mono red small" text-anchor="end">CONTINUE ↓</text>
</svg>

    <line x1="1036" y1="409" x2="1528" y2="409" class="hair"/><text x="1036" y="395" class="mono muted" font-size="9">01 · 时政</text><text x="1110" y="395" class="sans ink" font-size="12" font-weight="500">北京CBD何以影响世界？</text><line x1="1036" y1="443" x2="1528" y2="443" class="hair"/><text x="1036" y="429" class="mono muted" font-size="9">02 · 时政</text><text x="1110" y="429" class="sans ink" font-size="12" font-weight="500">北京CBD何以影响世界？</text><line x1="1036" y1="477" x2="1528" y2="477" class="hair"/><text x="1036" y="463" class="mono muted" font-size="9">03 · 民生</text><text x="1110" y="463" class="sans ink" font-size="12" font-weight="500">小心雷阵雨！端午假期天气预报来啦</text><line x1="1036" y1="511" x2="1528" y2="511" class="hair"/><text x="1036" y="497" class="mono muted" font-size="9">04 · CBD</text><text x="1110" y="497" class="sans ink" font-size="12" font-weight="500">来听听这YOUNG的声音</text><line x1="1036" y1="545" x2="1528" y2="545" class="hair"/><text x="1036" y="531" class="mono muted" font-size="9">05 · 文明办</text><text x="1110" y="531" class="sans ink" font-size="12" font-weight="500">@朝阳少年，“成长搭子”已就位</text><line x1="1036" y1="579" x2="1528" y2="579" class="hair"/><text x="1036" y="565" class="mono muted" font-size="9">06 · 王四营</text><text x="1110" y="565" class="sans ink" font-size="12" font-weight="500">购车、潮玩和演出！就在汽车消费季</text><line x1="1036" y1="613" x2="1528" y2="613" class="hair"/><text x="1036" y="599" class="mono muted" font-size="9">07 · 时政</text><text x="1110" y="599" class="sans ink" font-size="12" font-weight="500">国家文化产业创新实验区发展大会</text><line x1="1036" y1="647" x2="1528" y2="647" class="hair"/><text x="1036" y="633" class="mono muted" font-size="9">08 · 民生</text><text x="1110" y="633" class="sans ink" font-size="12" font-weight="500">全市启动防汛四级响应，三预警齐发</text><line x1="1036" y1="681" x2="1528" y2="681" class="hair"/><text x="1036" y="667" class="mono red" font-size="9">09 · 民生</text><text x="1110" y="667" class="sans ink" font-size="12" font-weight="700">暴雨蓝警+雷电黄警！假期出行请注意</text><line x1="1036" y1="715" x2="1528" y2="715" class="hair"/><text x="1036" y="701" class="mono muted" font-size="9">10 · 活动</text><text x="1110" y="701" class="sans ink" font-size="12" font-weight="500">端午倒计时！这份朝阳攻略快收好</text>

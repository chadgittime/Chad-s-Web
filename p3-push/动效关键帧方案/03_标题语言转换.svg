      <text x="72" y="978" class="mono muted small">MOTION NOTE</text>
      <text x="210" y="978" class="sans muted" font-size="13">文字在8px范围内交叉淡入；不使用逐字打字机效果，避免把编辑判断变成装饰。</text>

      <text x="72" y="880" class="mono muted small" >00</text><text x="72" y="908" class="sans ink" font-size="15" font-weight="700" >原始来稿</text><text x="436" y="880" class="mono muted small" >01</text><text x="436" y="908" class="sans ink" font-size="15" font-weight="700" >识别事实</text><text x="800" y="880" class="mono red small" >02</text><text x="800" y="908" class="sans ink" font-size="15" font-weight="700" >寻找用户切口</text><text x="1164" y="880" class="mono muted small" >03</text><text x="1164" y="908" class="sans ink" font-size="15" font-weight="700" >生成标题</text><text x="1528" y="880" class="mono muted small" text-anchor="end">04</text><text x="1528" y="908" class="sans ink" font-size="15" font-weight="700" text-anchor="end">进入风格数据</text>

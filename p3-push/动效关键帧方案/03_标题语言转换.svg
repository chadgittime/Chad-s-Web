    <circle cx="588" cy="404" r="4" fill="#1f77b4"/><text x="602" y="409" class="mono blue small">事实核验通过</text>
    <text x="582" y="452" class="sans ink body" font-weight="700">用户最关心什么？</text><text x="898" y="452" class="mono red small" text-anchor="end">最高奖励500万</text><line x1="582" y1="474" x2="898" y2="474" class="hair"/><text x="582" y="524" class="sans ink body" font-weight="700">谁能获得？</text><text x="898" y="524" class="mono muted small" text-anchor="end">一人公司</text><line x1="582" y1="546" x2="898" y2="546" class="hair"/><text x="582" y="596" class="sans ink body" font-weight="700">背景是否进标题？</text><text x="898" y="596" class="mono muted small" text-anchor="end">不进入</text><line x1="582" y1="618" x2="898" y2="618" class="hair"/><text x="582" y="668" class="sans ink body" font-weight="700">阅读动作是什么？</text><text x="898" y="668" class="mono muted small" text-anchor="end">快速理解政策价值</text><line x1="582" y1="690" x2="898" y2="690" class="hair"/>

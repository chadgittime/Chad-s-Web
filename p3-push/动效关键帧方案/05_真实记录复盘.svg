<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#ffffff"/>
  <style>
  .sans{font-family:Inter,"Noto Sans SC","Source Han Sans SC","PingFang SC",sans-serif}
  .mono{font-family:"Space Mono","SFMono-Regular",monospace}
  .ink{fill:#111315}.muted{fill:#5b6066}.light{fill:#9aa0a6}.red{fill:#e4002b}.blue{fill:#1f77b4}
  .body{font-size:16px}.small{font-size:12px}.micro{font-size:10px;letter-spacing:1.6px}
  .hair{stroke:#d9dcdf;stroke-width:1}.rule{stroke:#111315;stroke-width:1.5}.redrule{stroke:#e4002b;stroke-width:2}
</style>
  <rect x="72" y="52" width="1456" height="4" fill="#e4002b"/>
  <text x="72" y="92" class="mono red" font-size="12" letter-spacing="2">EVIDENCE-BASED REVIEW / FRAME 05</text>
  <text x="72" y="164" class="sans ink" font-size="54" font-weight="800">每一次判断，都能回到一条真实记录。</text>
  <text x="76" y="205" class="sans muted body">案例正常向上滚动，右侧固定摘要只随当前案例切换，证据始终可见。</text>
  <text x="1290" y="92" class="mono muted small">SCROLL-DRIVEN</text>
  <text x="1290" y="116" class="mono ink small">FRAME 052 / 100</text>
  <line x1="1290" y1="132" x2="1528" y2="132" class="hair"/>
  <line x1="1290" y1="132" x2="1413.76" y2="132" class="redrule"/>
  <line x1="72" y1="264" x2="1528" y2="264" class="rule"/>
  
  <g>
    <text x="72" y="304" class="mono muted micro">01 / EVIDENCE TIMELINE</text>
    <text x="72" y="340" class="sans ink" font-size="24" font-weight="750">五条真实记录</text>
    <line x1="94" y1="382" x2="94" y2="718" stroke="#d9dcdf" stroke-width="2"/>
    <line x1="94" y1="382" x2="94" y2="550" stroke="#e4002b" stroke-width="2"/>
    <circle cx="94" cy="392" r="6" fill="#ffffff" stroke="#111315" stroke-width="2"/><text x="124" y="389" class="mono muted small">01 / 07.06 · 商务局</text><text x="124" y="415" class="sans ink" font-size="17" font-weight="650">专业数据</text><circle cx="94" cy="474" r="6" fill="#ffffff" stroke="#111315" stroke-width="2"/><text x="124" y="471" class="mono muted small">02 / 05.29 · 文旅集团</text><text x="124" y="497" class="sans ink" font-size="17" font-weight="650">活动场景</text><circle cx="94" cy="556" r="9" fill="#e4002b" stroke="#e4002b" stroke-width="2"/><text x="124" y="553" class="mono red small">03 / 04.03 · 三方协同</text><text x="124" y="579" class="sans ink" font-size="17" font-weight="800">联合来源</text><circle cx="94" cy="638" r="6" fill="#ffffff" stroke="#111315" stroke-width="2"/><text x="124" y="635" class="mono muted small">04 / 06.08 · 民生提示</text><text x="124" y="661" class="sans ink" font-size="17" font-weight="650">民生预警</text><circle cx="94" cy="720" r="6" fill="#ffffff" stroke="#111315" stroke-width="2"/><text x="124" y="717" class="mono muted small">05 / 06.18 · 单日10条</text><text x="124" y="743" class="sans ink" font-size="17" font-weight="650">峰值调度</text>
  </g>
  <line x1="474" y1="264" x2="474" y2="770" class="hair"/>
  <g>
    <text x="516" y="304" class="mono red micro">02 / ACTIVE CASE 03</text>
    <text x="516" y="340" class="sans ink" font-size="24" font-weight="750">联合来源先拆责任，再统一主线。</text>
    <rect x="516" y="372" width="1012" height="94" fill="#111315"/>
    <text x="542" y="405" class="mono red small">2026-04-03 · 园林绿化局 × 北京公交集团 × 朝阳文旅集团</text>
    <text x="542" y="441" class="sans" fill="#ffffff" font-size="23" font-weight="750">“免费！朝阳花园节接驳巴士发车喽——”</text>
    <g transform="translate(516,506)">
      <text x="0" y="0" class="mono muted micro">JUDGMENT</text>
      <text x="0" y="40" class="sans ink" font-size="19" font-weight="750">谁确认什么？</text>
      <text x="0" y="76" class="sans muted body">活动体验、交通信息与公共服务，</text>
      <text x="0" y="104" class="sans muted body">分别由不同来源承担事实责任。</text>
      <line x1="0" y1="138" x2="280" y2="138" class="hair"/>
      <text x="344" y="0" class="mono muted micro">PROCESS</text>
      <text x="344" y="40" class="sans ink" font-size="19" font-weight="750">先确定用户主线</text>
      <text x="344" y="76" class="sans muted body">按责任边界逐项核对，</text>
      <text x="344" y="104" class="sans muted body">再合并为一个发布口径。</text>
      <line x1="344" y1="138" x2="624" y2="138" class="hair"/>
      <text x="688" y="0" class="mono red micro">TRANSFER</text>
      <text x="688" y="40" class="sans ink" font-size="19" font-weight="750">反馈边界清晰</text>
      <text x="688" y="76" class="sans muted body">面对多角色作者或业务方时，</text>
      <text x="688" y="104" class="sans muted body">判断与协同可以同时落地。</text>
      <line x1="688" y1="138" x2="1012" y2="138" class="redrule"/>
    </g>
    <text x="516" y="724" class="mono muted small">EVERY CLAIM RETURNS TO A DATE, A TITLE AND A SOURCE.</text>
    <text x="1528" y="724" class="mono red" font-size="30" font-weight="700" text-anchor="end">03 / 05</text>
  </g>
  
    <g transform="translate(0,0)">
      <text x="72" y="812" class="mono muted micro">SCROLL PROTOCOL / 050%</text>
      <line x1="72" y1="842" x2="1528" y2="842" class="hair"/>
      <line x1="72" y1="842" x2="800" y2="842" class="redrule"/>
      <circle cx="72" cy="842" r="5" fill="#111315" stroke="#111315" stroke-width="2"/><circle cx="436" cy="842" r="5" fill="#111315" stroke="#111315" stroke-width="2"/><circle cx="800" cy="842" r="7" fill="#111315" stroke="#111315" stroke-width="2"/><circle cx="1164" cy="842" r="5" fill="#ffffff" stroke="#111315" stroke-width="2"/><circle cx="1528" cy="842" r="5" fill="#ffffff" stroke="#111315" stroke-width="2"/>
      <text x="72" y="880" class="mono muted small" >00</text><text x="72" y="908" class="sans ink" font-size="15" font-weight="700" >专业数据</text><text x="436" y="880" class="mono muted small" >01</text><text x="436" y="908" class="sans ink" font-size="15" font-weight="700" >活动场景</text><text x="800" y="880" class="mono red small" >02</text><text x="800" y="908" class="sans ink" font-size="15" font-weight="700" >联合来源</text><text x="1164" y="880" class="mono muted small" >03</text><text x="1164" y="908" class="sans ink" font-size="15" font-weight="700" >民生预警</text><text x="1528" y="880" class="mono muted small" text-anchor="end">04</text><text x="1528" y="908" class="sans ink" font-size="15" font-weight="700" text-anchor="end">峰值调度</text>
      <line x1="72" y1="950" x2="1528" y2="950" class="rule"/>
      <text x="72" y="978" class="mono muted small">MOTION NOTE</text>
      <text x="210" y="978" class="sans muted" font-size="13">红点跟随案例位置移动；右侧摘要用220ms淡入切换，不改变案例正文的自然阅读。</text>
      <text x="1528" y="978" class="mono red small" text-anchor="end">CONTINUE ↓</text>
    </g>
  </svg>